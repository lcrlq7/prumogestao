.rc.same{background:var(--gray-soft)} .rc.same .ic{color:var(--muted)}
.rc.fail{background:var(--crit-soft);border-color:color-mix(in srgb,var(--crit) 30%,transparent)} .rc.fail .ic{color:var(--crit)}
#rep-box{display:flex;flex-direction:column;gap:12px;min-width:0}
/* Ações em lote */
.bulkbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:15;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;border-radius:10px;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);box-shadow:var(--shadow)}
.bulkbar-actions{display:flex;flex-wrap:wrap;gap:8px}
.tbl tr.row-sel td{background:color-mix(in srgb,var(--accent) 9%,var(--surface))}
.tbl .w-check input{width:16px;height:16px;cursor:pointer;accent-color:var(--accent)}
.del-list{list-style:none;margin:0;padding:8px 12px;border:1px solid var(--line);border-radius:8px;max-height:220px;overflow:auto;display:flex;flex-direction:column;gap:4px;font-size:13px}
.del-list .mono{display:inline-block;min-width:44px;color:var(--muted)}
.del-impact{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;color:var(--ink-2);font-size:13px}
/* Alterar função */
fieldset.roles{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
fieldset.roles legend{font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:6px;padding:0}
.role-opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line-2);border-radius:8px;cursor:pointer}
.role-opt:hover{border-color:var(--accent)}
.role-opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.role-opt.cur{opacity:.55;cursor:default}
.role-opt input[type=radio]{width:16px;height:16px;min-width:16px;flex:none;padding:0;margin:3px 0 0;accent-color:var(--accent)}
.role-opt b{display:block;font-size:13.5px}
.role-opt small{display:block;color:var(--muted);font-size:12.5px}
/* Hierarquia */
.hier{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 18px}
.hier-l{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;padding:10px 16px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface-2);width:100%}
.hier-l.l4{max-width:520px;border-color:color-mix(in srgb,var(--plumb) 55%,transparent);background:color-mix(in srgb,var(--plumb) 10%,var(--surface))}
.hier-l.l3{max-width:620px;border-color:color-mix(in srgb,var(--accent) 45%,transparent);background:var(--accent-soft)}
.hier-l.l2{max-width:760px}
.hier-l.l1{max-width:880px}
.hier-k{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--ink-2)}
.hier-l b{font-size:13.5px}
.hier-l small{color:var(--muted);font-size:12px}
.role-admin{background:color-mix(in srgb,var(--plumb) 18%,var(--surface));color:var(--ink)}
.role-office{background:var(--accent-soft);color:var(--accent)}
.role-manager{background:var(--good-soft);color:var(--good)}
.role-employee{background:var(--gray-soft);color:var(--ink-2)}
.steps li.skip{opacity:.5}
.steps li.skip>span{border-style:dashed}

/* Foto de perfil */
.avatar.has-photo{background:var(--gray-soft);overflow:hidden;padding:0}
.avatar.has-photo img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
:root[data-theme="dark"] .avatar.has-photo{filter:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .avatar.has-photo{filter:none}}
.avatar.xl{width:96px;height:96px;font-size:32px}
.profile-photo{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.profile-photo-actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px;flex:1;min-width:200px}
.profile-photo-actions small{flex-basis:100%;font-size:12px}
.profile-photo-actions label.btn{cursor:pointer}
button.me{background:none;border:0;border-left:1px solid var(--line);cursor:pointer;color:inherit;text-align:left;font:inherit;border-radius:0}
button.me:hover .me-txt b{color:var(--accent)}
.role-extra{display:block;margin-top:3px;font-size:12px}
/* Reconhecimento e destaques */
.ins-rec .ins-ic{background:var(--warn-soft);color:var(--warn)}
.ins-rec .ins-tag{color:var(--warn)}
.hl-tools{padding:12px 16px 4px;margin:0}
.hl-tbl td{vertical-align:middle}
.hl-tbl .chips{display:flex;flex-wrap:wrap;gap:4px}
.hl-tbl td:last-child{min-width:260px}
.hl-pos{display:inline-flex;align-items:center;gap:4px;font-weight:700;white-space:nowrap;color:var(--ink-2)}
.hl-pos svg{width:16px;height:16px}
.hl-1{color:#c9a227}.hl-2{color:#8e9aa6}.hl-3{color:#b5733c}
.hl-more{padding:8px 16px 0}
.hl-note{padding:8px 16px 14px;margin:0}
.hl-note p{margin:6px 0 0}
.hl-block{border-top:1px solid var(--line);padding-top:4px;margin-top:8px}
.hl-dept{margin:10px 16px 8px;font-size:14px}
.hl-cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;padding:0 16px 10px}
.hl-cat{display:flex;flex-direction:column;gap:1px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);min-width:0}
.hl-cat small{display:flex;align-items:center;gap:4px;color:var(--warn);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em}
.hl-cat small svg{width:13px;height:13px}
.hl-cat b{font-size:13.5px;overflow-wrap:anywhere}
.hl-cat span{font-size:12px;color:var(--ink-2)}
.hl-tie{display:block;font-size:11px;color:var(--ink-2)}
.hl-excl{display:flex;gap:6px;align-items:flex-start;padding:6px 16px 8px;margin:0}
.hl-excl svg{width:14px;height:14px;flex:none;margin-top:2px}
.ins-acts{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:6px}
.rec-list{list-style:none;margin:0;padding:0}
.rec-item{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-top:1px solid var(--line)}
.rec-item:first-child{border-top:0}
.rec-ic{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--warn-soft);color:var(--warn);flex:none}
.rec-ic svg{width:17px;height:17px}
.rec-b{flex:1;min-width:0}
.rec-h{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.rec-b p{margin:4px 0 2px;overflow-wrap:anywhere}
.rec-acts{display:flex;gap:2px;flex:none}
.rec-acts .on{color:var(--accent)}
.chip-wall{background:var(--good-soft);color:var(--good)}
.rec-recv{border-left:3px solid var(--warn)}
.wall{list-style:none;margin:0;padding:0}
.wall-item{display:flex;gap:14px;align-items:flex-start;padding:16px;border-top:1px solid var(--line)}
.wall-item:first-child{border-top:0}
.wall-item .avatar{flex:none}
.wall-b{flex:1;min-width:0}
.wall-h{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.wall-h .chip-s{display:inline-flex;align-items:center;gap:4px}
.wall-h .chip-s svg{width:12px;height:12px}
.wall-b p{margin:6px 0 4px;font-size:14.5px;line-height:1.5;overflow-wrap:anywhere}
.mgr-card{display:flex;align-items:center;gap:12px;padding:12px 16px;margin:0 0 16px;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:12px;max-width:560px}
.mgr-card .avatar{flex:none}
.mgr-t{display:flex;flex-direction:column;gap:1px;min-width:0}
.mgr-t small{color:var(--ink-2);font-size:12px}
.mgr-t b{font-size:15px}
.mgr-t span{font-size:13px;color:var(--ink-2);overflow-wrap:anywhere}
.mgr-t a{color:var(--accent)}
.role-dir{font-style:normal;font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;margin-left:6px;vertical-align:1px}
.role-dir.up{background:var(--good-soft);color:var(--good)}
.role-dir.down{background:var(--warn-soft);color:var(--warn)}
.me-txt{display:block}
/* Celular: barra superior enxuta (só a foto do perfil), alvos de toque maiores e campos sem zoom automático no iOS */
@media (max-width:640px){
  .me-txt{display:none}
  .top .ibtn,.top .menu-btn{min-width:40px;min-height:40px}
  input,select,textarea{font-size:16px}
  .modal{max-height:calc(100dvh - 24px);overflow:auto}
  .page-head{flex-wrap:wrap;gap:12px}
  .head-actions{flex-wrap:wrap}
}
/* ================= Extras (js/extras.js) ================= */
/* Busca na barra superior */
.search-btn{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2);color:var(--muted);cursor:pointer;font-size:13px;min-width:190px;transition:border-color .15s,color .15s}
.search-btn:hover{border-color:var(--accent);color:var(--ink)}
.search-btn .ic{width:16px;height:16px}
.search-btn span{flex:1;text-align:left}
kbd{font:600 10.5px/1 var(--f-mono);padding:3px 6px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:5px;background:var(--surface);color:var(--ink-2);white-space:nowrap}
/* Sino balançando */
.bell.ring .ic{animation:ring .9s ease;transform-origin:50% 2px}
@keyframes ring{10%,30%,50%{transform:rotate(14deg)}20%,40%,60%{transform:rotate(-12deg)}75%{transform:rotate(5deg)}100%{transform:none}}
/* Painel de notificações */
#notif-panel{position:fixed;z-index:70;width:min(380px,calc(100vw - 16px));max-height:min(520px,calc(100vh - 90px));display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 50px rgba(8,16,24,.28);animation:npIn .2s ease}
@keyframes npIn{from{opacity:0;transform:translateY(-6px) scale(.98)}to{opacity:1;transform:none}}
#notif-panel header,#notif-panel footer{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);font-size:13px}
#notif-panel footer{border-bottom:0;border-top:1px solid var(--line)}
#notif-panel footer .link{display:inline-flex;align-items:center;gap:6px}
.np-list{overflow:auto;flex:1}
.np-item{display:flex;gap:10px;width:100%;text-align:left;padding:11px 14px;border:0;border-bottom:1px solid var(--line);background:none;cursor:pointer;position:relative}
.np-item:hover{background:var(--surface-2)}
.np-item.unread{background:color-mix(in srgb,var(--accent-soft) 55%,transparent)}
.np-item.unread::after{content:"";position:absolute;right:12px;top:16px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.np-ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.np-ic .ic{width:15px;height:15px}
.np-ic.t-reconhecimento,.np-ic.t-mural{background:var(--warn-soft);color:var(--warn)}
.np-ic.t-ferias{background:var(--good-soft);color:var(--good)}
.np-t{display:flex;flex-direction:column;gap:2px;min-width:0;padding-right:14px}
.np-t b{font-size:13.5px}
.np-t small{color:var(--ink-2);font-size:12.5px;overflow-wrap:anywhere}
.np-t em{font-style:normal;font-size:11.5px;color:var(--muted)}
.np-empty{padding:28px 18px;text-align:center;color:var(--muted)}
.np-hint{margin:0;padding:7px 14px;font-size:11.5px;color:var(--muted);border-top:1px solid var(--line);text-align:center}
.np-empty .ic{width:28px;height:28px;opacity:.6}
/* Pop-up de notificação */
#notif-pop{position:fixed;right:16px;top:64px;z-index:95;display:flex;flex-direction:column;gap:8px;width:min(360px,calc(100vw - 32px))}
.npop{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:12px 14px;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:12px;background:var(--surface);box-shadow:0 12px 34px rgba(8,16,24,.22);cursor:pointer;animation:npop .35s cubic-bezier(.2,.8,.2,1)}
.npop.out{opacity:0;transform:translateX(20px);transition:opacity .35s,transform .35s}
@keyframes npop{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
.npop-ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.npop-ic .ic{width:15px;height:15px}
.npop-t{display:flex;flex-direction:column;gap:2px;min-width:0}
.npop-t small{color:var(--ink-2);font-size:12.5px}
/* Busca global */
.ck-root{position:fixed;inset:0;z-index:90;display:grid;justify-items:center;align-items:start;padding:12vh 16px 16px}
.ck-back{position:absolute;inset:0;background:rgba(8,16,24,.5);backdrop-filter:blur(2px);animation:fadeIn .15s}
.ck{position:relative;width:min(620px,100%);background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 30px 80px rgba(0,0,0,.35);overflow:hidden;animation:ckIn .18s cubic-bezier(.2,.8,.2,1)}
@keyframes ckIn{from{opacity:0;transform:translateY(-10px) scale(.98)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}}
.ck-in{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.ck-in .ic{width:19px;height:19px;color:var(--muted)}
.ck-in input{flex:1;border:0;outline:0;background:none;font-size:16px;min-width:0}
.ck-list{max-height:min(420px,55vh);overflow:auto;padding:6px}
.ck-g{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;padding:10px 10px 4px}
.ck-i{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:0;border-radius:9px;background:none;cursor:pointer;text-align:left}
.ck-i.on,.ck-i:hover{background:var(--accent-soft)}
.ck-ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--surface-2);color:var(--accent);flex:none}
.ck-ic .ic{width:16px;height:16px}
.ck-t{flex:1;min-width:0;display:flex;flex-direction:column}
.ck-t b{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ck-t small{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ck-empty{padding:28px;text-align:center;color:var(--muted)}
.ck-foot{display:flex;gap:16px;padding:9px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.kbd-list{display:grid;gap:8px;margin:0}
.kbd-list div{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--line)}
.kbd-list dt{display:flex;gap:4px;align-items:center}
.kbd-list dd{margin:0;color:var(--ink-2)}
/* Esqueleto de carregamento */
.sk{background:linear-gradient(90deg,var(--surface-2) 25%,var(--line) 37%,var(--surface-2) 63%);background-size:400% 100%;animation:shimmer 1.2s ease infinite;border-radius:10px}
@keyframes shimmer{0%{background-position:100% 50%}100%{background-position:0 50%}}
.sk-page{display:flex;flex-direction:column;gap:16px}
.sk-title{height:30px;width:min(340px,70%)}
.sk-sub{height:14px;width:min(480px,90%)}
.sk-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}
.sk-kpi{height:104px}
.sk-grid{display:grid;grid-template-columns:2fr 1fr;gap:16px}
.sk-card{height:280px}
.sk-wide{height:180px}
@media (max-width:1020px){.sk-grid{grid-template-columns:1fr}}
/* Transição de página e entrada dos elementos */
.view.anim{animation:pageIn .38s cubic-bezier(.2,.7,.2,1)}
@keyframes pageIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.view.anim .kpi,.view.anim .dblock,.view.anim .card{animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
.view.anim .kpi:nth-child(2),.view.anim .dblock:nth-child(2){animation-delay:.05s}
.view.anim .kpi:nth-child(3),.view.anim .dblock:nth-child(3){animation-delay:.1s}
.view.anim .kpi:nth-child(4),.view.anim .dblock:nth-child(4){animation-delay:.15s}
.view.anim .kpi:nth-child(n+5),.view.anim .dblock:nth-child(n+5){animation-delay:.2s}
.view.anim .chart .bar{transform-box:fill-box;transform-origin:50% 100%;animation:barUp .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes barUp{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.view.anim .chart .ln{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s ease .15s forwards}
.view.anim .chart .area{animation:fadeIn .9s ease .4s both}
.view.anim .chart .dot{animation:fadeIn .3s ease 1.1s both}
@keyframes draw{to{stroke-dashoffset:0}}
.view.anim .progress b,.view.anim .load-track .fill,.view.anim .hb-track b{transform-origin:left;animation:growX .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes growX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
/* Ponto que acompanha o valor nos gráficos de linha */
.chart .hdot{opacity:0;stroke:var(--surface);stroke-width:2;transition:opacity .12s;pointer-events:none}
.chart .band:hover .hdot{opacity:1}
.chart .hdot.s1{fill:var(--s1)}.chart .hdot.s2{fill:var(--s2)}.chart .hdot.s3{fill:var(--s3)}.chart .hdot.s4{fill:var(--s4)}.chart .hdot.s5{fill:var(--s5)}
/* Cartões que reagem ao mouse */
.kpi,.dash .card,.mini,.hl-cat,.wall-item{transition:transform .2s ease,box-shadow .2s ease,border-color .2s}
.kpi:hover,.dash .card:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(15,30,44,.10)}
.mini:hover,.hl-cat:hover{transform:translateY(-2px)}
/* Botão que pulsa */
.btn.pulse{animation:pulse .5s ease}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 55%,transparent)}100%{box-shadow:0 0 0 12px transparent}}
/* Confirmação animada */
.ok-burst{position:fixed;left:50%;top:42%;z-index:96;width:84px;height:84px;margin:-42px 0 0 -42px;pointer-events:none;animation:okOut .9s ease forwards}
.ok-burst svg{width:100%;height:100%;fill:none;stroke-linecap:round;stroke-linejoin:round}
.ok-burst circle{stroke:var(--good);stroke-width:3;fill:var(--surface);stroke-dasharray:151;stroke-dashoffset:151;animation:okC .45s ease forwards}
.ok-burst path{stroke:var(--good);stroke-width:4;stroke-dasharray:40;stroke-dashoffset:40;animation:okP .3s ease .35s forwards}
@keyframes okC{to{stroke-dashoffset:0}}
@keyframes okP{to{stroke-dashoffset:0}}
@keyframes okOut{0%{opacity:0;transform:scale(.7)}15%{opacity:1;transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:scale(1.05)}}
.confetti{position:fixed;inset:0;z-index:97;pointer-events:none}
/* Dashboard em blocos */
.dash{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:18px}
.dblock{min-width:0;display:flex;flex-direction:column}
.dblock>.card{flex:1}
.b-full{grid-column:span 6}.b-wide{grid-column:span 4}.b-half{grid-column:span 3}.b-third{grid-column:span 2}
@media (max-width:1200px){.b-wide,.b-half,.b-third{grid-column:span 3}}
@media (max-width:1020px){.b-full,.b-wide,.b-half,.b-third{grid-column:span 6}}
.dz-list{list-style:none;margin:10px 0;padding:0;display:flex;flex-direction:column;gap:6px}
.dz-list li{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:grab}
.dz-list li.dragging{opacity:.5;border-style:dashed}
.dz-list label{flex:1;display:flex;align-items:center;gap:8px;cursor:pointer}
.dz-list input{width:16px;height:16px}
.dz-grip .ic{width:16px;height:16px;color:var(--muted)}
.dz-mv{display:flex}
/* Resumo semanal */
.wsum{padding:18px 20px;background:linear-gradient(135deg,color-mix(in srgb,var(--accent-soft) 70%,var(--surface)),var(--surface) 60%)}
.wsum-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.wsum-h h3{font-size:19px}
.wsum-h p{margin:2px 0 0;color:var(--ink-2);font-size:13px}
.wsum-ic{width:34px;height:34px;color:var(--plumb);flex:none}
.wsum-l{list-style:none;margin:14px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:8px 22px}
.wsum-l li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.wsum-l li>.ic{flex:none;width:18px;height:18px;margin-top:2px;color:var(--accent)}
.wsum-l li.t-crit>.ic{color:var(--crit)}.wsum-l li.t-warn>.ic{color:var(--warn)}.wsum-l li.t-ok>.ic{color:var(--good)}
.wsum-l li>span{flex:1}
.wsum-l .link{white-space:nowrap;display:inline-flex;align-items:center;gap:3px;font-size:12.5px}
.wsum-l .link .ic{width:13px;height:13px}
/* Modo apresentação */
.app.present{grid-template-columns:minmax(0,1fr)}
.app.present .side,.app.present .top,.app.present .scrim,.app.present .page-head .head-actions,.app.present [data-block=resumo]{display:none}
.app.present .view{max-width:none;padding:32px 40px;font-size:15px}
.app.present .page-head h1{font-size:34px}
.app.present .kpi-value{font-size:44px}
.app.present .card-h h3{font-size:18px}
.present-exit{position:fixed;right:18px;bottom:18px;z-index:60;display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);cursor:pointer;opacity:.35;transition:opacity .2s}
.present-exit:hover{opacity:1}
/* Tour */
.tour{position:fixed;inset:0;z-index:98}
.tour-spot{position:fixed;border-radius:12px;box-shadow:0 0 0 9999px rgba(8,16,24,.6);transition:all .35s cubic-bezier(.2,.8,.2,1);pointer-events:none;outline:2px solid var(--plumb)}
.tour-box{position:fixed;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 20px 50px rgba(0,0,0,.3);transition:left .35s,top .35s;animation:fadeIn .25s}
.tour-box small{color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.06em}
.tour-box b{display:block;font:700 17px/1.3 var(--f-display);margin:4px 0}
.tour-box p{margin:0 0 14px;color:var(--ink-2)}
.tour-b{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tour-b span{display:flex;gap:6px}
/* Lançamento em lote */
.be-tools{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin:14px 0 8px}
.be-tools .in-ic{flex:1;min-width:200px}
.check-inline{display:inline-flex;align-items:center;gap:7px;cursor:pointer;font-size:13.5px}
.check-inline input{width:16px;height:16px;margin:0}
.be-list{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:4px}
.be-co{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:7px;cursor:pointer}
.be-co:hover{background:var(--surface-2)}
.be-co input{width:16px;height:16px;margin:0;flex:none}
.be-co span{flex:1;min-width:0}
.be-co em{font-style:normal;font-size:11px;padding:1px 7px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.be-none{padding:14px}
.be-calc{margin:10px 0 0;font-size:14px}
/* Obrigações fiscais */
.tag.obr{background:color-mix(in srgb,#8b5cf6 18%,var(--surface));color:#7c4ddb}
:root[data-theme="dark"] .tag.obr{color:#c4a8ff}
.obr-list{list-style:none;margin:0;padding:0}
.obr-list li{display:flex;gap:12px;align-items:flex-start;padding:9px 16px;border-top:1px solid var(--line)}
.obr-list li:first-child{border-top:0}
.obr-list li>.link{font-family:var(--f-mono);font-size:12.5px;white-space:nowrap;padding-top:1px}
.obr-list li span{display:flex;flex-direction:column}
.obr-list li small{color:var(--muted);font-size:12px}
.obr-list li.past{opacity:.55}
.obr-list li.soon b{color:#7c4ddb}
.obr-note{padding:6px 16px 12px;margin:0}
.dot-c.purple{background:#8b5cf6}
.alert-i.purple .al-ic{background:color-mix(in srgb,#8b5cf6 16%,var(--surface));color:#7c4ddb}
.btn.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
/* Quadro de tarefas */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:12px;overflow-x:auto;padding-bottom:6px}
.bcol{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;min-height:180px;transition:border-color .15s,background .15s}
.bcol.over{border-color:var(--accent);background:var(--accent-soft)}
.bcol header{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.bcol header b{flex:1}
.bcol header em{font-style:normal;font-size:12px;font-family:var(--f-mono);background:var(--surface);padding:0 7px;border-radius:999px;border:1px solid var(--line)}
.bcol-b{padding:8px;display:flex;flex-direction:column;gap:8px;flex:1}
.bcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 10px;cursor:grab;box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s}
.bcard:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(15,30,44,.1)}
.bcard.dragging{opacity:.45;transform:rotate(-2deg)}
.bcard b{display:block;font-size:13px;font-weight:600}
.bcard small{display:flex;align-items:center;gap:4px;color:var(--muted);font-size:11.5px;margin-top:3px}
.bcard.late{border-left:3px solid var(--crit)}
.bcard.late small{color:var(--crit)}
.bcard small .ic{width:12px;height:12px}
.bcol-empty{margin:auto;color:var(--muted);font-size:12px;text-align:center;padding:16px 4px;border:1.5px dashed var(--line-2);border-radius:9px;width:100%}
.board-note{margin:0}
/* Configurações */
.pref-rows{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.pref-btns{display:flex;flex-wrap:wrap;gap:8px}
/* Mini avatar (calendário de férias) */
.avatar.xs{width:15px;height:15px;font-size:7px;margin-right:3px;vertical-align:-3px;display:inline-grid}
/* Modo compacto das tabelas */
body.dense .tbl th,body.dense .tbl td{padding-top:5px;padding-bottom:5px}
body.dense .tbl .avatar{width:24px;height:24px;font-size:10px}
body.dense .tbl small{font-size:11px}
@media (max-width:640px){
  .search-btn{min-width:0;padding:0;width:40px;justify-content:center}
  .search-btn span,.search-btn kbd{display:none}
  .wsum-l{grid-template-columns:1fr}
  .ck-root{padding:8px}
  .ck-foot{display:none}
  .app.present .view{padding:16px}
}
@media (prefers-reduced-motion:reduce){.view.anim,.view.anim *{animation:none!important}.sk{animation:none}}

/* Título da barra superior encurta com reticências quando falta espaço */
.top-title{min-width:0;overflow:hidden;flex:1}
.top-title>span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
/* ================= Agenda: reuniões e eventos (js/agenda.js) ================= */
.tag.reuniao{background:color-mix(in srgb,var(--s1) 16%,var(--surface));border-color:color-mix(in srgb,var(--s1) 50%,transparent);color:var(--ink)}
.tag.evento{background:color-mix(in srgb,var(--s5) 16%,var(--surface));border-color:color-mix(in srgb,var(--s5) 50%,transparent);color:var(--ink)}
.tag.reuniao b,.tag.evento b{font-family:var(--f-mono);font-weight:600;font-size:10px}
.lg-vac2,.lg-meet,.lg-ev{width:16px;height:12px;border-radius:3px;display:inline-block;margin-left:8px}
.lg-vac2{background:color-mix(in srgb,var(--s3) 25%,var(--surface));border:1px solid var(--s3)}
.lg-meet{background:color-mix(in srgb,var(--s1) 25%,var(--surface));border:1px solid var(--s1)}
.lg-ev{background:color-mix(in srgb,var(--s5) 25%,var(--surface));border:1px solid var(--s5)}
.evt.reuniao .ic{color:var(--s1)} .evt.evento .ic{color:var(--s5)} .evt.obr .ic{color:#8b5cf6}
.evt>span{flex:1;min-width:0}
.evt-people{display:flex;align-items:center;flex-wrap:wrap;gap:2px;margin-top:6px}
.evt-people .avatar.xs{width:20px;height:20px;font-size:8px;margin:0 -4px 0 0;border:2px solid var(--surface)}
.evt-people em{font-style:normal;font-size:11px;margin-left:8px;color:var(--ink-2)}
.evt-people small{display:inline;margin-left:10px}
.evt-acts{display:flex;gap:6px;margin-top:8px}
.evt-add{padding:8px 0;border-bottom:1px solid var(--line)}
.ag-kind{display:flex;gap:16px;align-items:center;border:0;padding:0;margin:0}
.ag-kind legend{font-size:12.5px;font-weight:600;color:var(--ink-2);margin-bottom:6px;padding:0}
.ag-dwarn{display:flex;align-items:center;gap:6px;margin:0;padding:8px 10px;border-radius:8px;background:var(--warn-soft);color:var(--warn);font-size:13px}
.ag-dwarn[hidden]{display:none}
.ag-dwarn .ic{width:15px;height:15px}
.ag-ph{display:flex;justify-content:space-between;align-items:baseline;margin:16px 0 8px}
.ag-ph span{font-size:12.5px;color:var(--muted)}
.ag-groups{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip-btn{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;color:var(--ink-2)}
.chip-btn:hover{border-color:var(--accent);color:var(--accent)}
.chip-btn .ic{width:12px;height:12px}
.chip-btn.ghost{border-style:dashed}
.ag-q{display:block;margin-bottom:8px}
.ag-people{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:6px}
.ag-dg>small{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:8px 6px 4px}
.ag-p{display:flex;align-items:center;gap:9px;padding:5px 6px;border-radius:8px;cursor:pointer}
.ag-p:hover{background:var(--surface-2)}
.ag-p[hidden]{display:none}
.ag-p input{width:16px;height:16px;margin:0;flex:none}
.ag-p .avatar{width:26px;height:26px;font-size:10px}
.ag-p span{display:flex;flex-direction:column;min-width:0}
.ag-p b{font-size:13px;font-weight:500}
.ag-p small{font-size:11px;color:var(--muted)}
@media (max-width:640px){
  .cal-cell .cal-tags{display:flex;flex-wrap:wrap;gap:3px;margin-top:2px}
  .cal-cell .cal-tags .tag{font-size:0;width:8px;height:8px;padding:0;border-radius:50%;line-height:0}
  .cal-cell .cal-tags .tag .avatar{display:none}
}

/* ================= Comunicação (js/chat.js) ================= */
.chat{display:grid;grid-template-columns:300px minmax(0,1fr);height:calc(100vh - 190px);min-height:460px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.chat-side{display:flex;flex-direction:column;border-right:1px solid var(--line);min-height:0;background:var(--surface-2)}
.chat-q{margin:12px}
.cv-list{overflow:auto;flex:1;padding:0 8px 12px}
.cv-g{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;padding:12px 8px 6px}
.cv{display:flex;align-items:center;gap:10px;width:100%;padding:8px;border:0;border-radius:10px;background:none;cursor:pointer;text-align:left;transition:background .15s}
.cv:hover{background:var(--surface)}
.cv.on{background:var(--accent-soft)}
.cv-ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);color:var(--accent);flex:none}
.cv-ic .ic{width:17px;height:17px}
.cv .avatar{width:34px;height:34px;flex:none}
.cv-t{flex:1;min-width:0;display:flex;flex-direction:column}
.cv-t b{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cv-t small{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cv.unread .cv-t b{color:var(--ink)}
.cv.unread .cv-t small{color:var(--ink-2);font-weight:500}
.cv-n{font-style:normal;font-size:11px;font-weight:700;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:1px 7px;min-width:20px;text-align:center}
.cv-time{font-size:11px;color:var(--muted);white-space:nowrap}
.cv.new .cv-t b{font-weight:500}
.cv-start{color:var(--muted);opacity:0;transition:opacity .15s}
.cv-start .ic{width:16px;height:16px}
.cv.new:hover .cv-start{opacity:1}
.cv-none{font-size:12.5px;color:var(--muted);padding:6px 8px;margin:0}
.chat-main{display:flex;flex-direction:column;min-height:0;min-width:0}
.chat-main.empty{justify-content:center;align-items:center;gap:18px;padding:24px}
.chat-rules{border:1px dashed var(--line-2);border-radius:12px;padding:14px 18px;max-width:420px;font-size:13px;color:var(--ink-2)}
.chat-rules ul{margin:8px 0 0;padding-left:18px;display:grid;gap:4px}
.chat-h{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.chat-h>div{display:flex;flex-direction:column;min-width:0}
.chat-h small{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-back{display:none}
.chat-msgs{flex:1;overflow:auto;padding:16px 18px;display:flex;flex-direction:column;gap:2px;scroll-behavior:smooth}
.msg-day{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:11.5px;margin:12px 0 8px}
.msg-day::before,.msg-day::after{content:"";flex:1;height:1px;background:var(--line)}
.msg{display:flex;gap:10px;align-items:flex-start;padding:4px 0;position:relative;animation:msgIn .25s ease}
@keyframes msgIn{from{opacity:0;transform:translateY(6px)}}
.msg.cont{padding-top:0}
.msg-av{width:32px;flex:none}
.msg-av .avatar{width:32px;height:32px}
.msg-b{max-width:min(620px,78%);display:flex;flex-direction:column;gap:3px}
.msg-h{display:flex;align-items:baseline;gap:8px}
.msg-h b{font-size:13px}
.msg-h small{font-size:11px;color:var(--muted)}
.msg-h time{font-size:11px;color:var(--muted)}
.msg-txt{background:var(--surface-2);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:8px 12px;line-height:1.45;overflow-wrap:anywhere}
.msg.me{flex-direction:row-reverse}
.msg.me .msg-b{align-items:flex-end}
.msg.me .msg-h{flex-direction:row-reverse}
.msg.me .msg-txt{background:var(--accent);color:var(--accent-ink);border-color:transparent;border-radius:14px 4px 14px 14px}
.msg.notice .msg-txt{background:color-mix(in srgb,var(--plumb) 12%,var(--surface));border-color:color-mix(in srgb,var(--plumb) 35%,transparent);color:var(--ink)}
.msg-txt.del{background:none;border-style:dashed;color:var(--muted);font-style:italic;display:flex;align-items:center;gap:6px}
.msg-txt.del .ic{width:13px;height:13px}
.msg-seen{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--muted)}
.msg-seen .ic{width:12px;height:12px}
.msg-del{opacity:0;align-self:center;width:28px;height:28px}
.msg:hover .msg-del{opacity:1}
.msg-empty{margin:auto;text-align:center;color:var(--muted)}
.msg-empty .ic{width:30px;height:30px;opacity:.6}
.chat-in{display:flex;gap:10px;align-items:flex-end;padding:12px 16px 4px;border-top:1px solid var(--line)}
.chat-in textarea{flex:1;resize:none;border:1px solid var(--line-2);border-radius:12px;padding:10px 12px;background:var(--surface);max-height:160px;line-height:1.4}
.chat-in textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.chat-hint{margin:0;padding:0 16px 10px;font-size:11px;color:var(--muted)}
.chat-ro{display:flex;align-items:center;gap:8px;justify-content:center;padding:14px;border-top:1px solid var(--line);color:var(--muted);font-size:13px;background:var(--surface-2)}
.chat-ro .ic{width:15px;height:15px}
@media (max-width:1020px){
  .chat{grid-template-columns:minmax(0,1fr);height:calc(100dvh - 170px)}
  .chat.has-conv .chat-side{display:none}
  .chat:not(.has-conv) .chat-main{display:none}
  .chat-back{display:inline-grid}
  .msg-b{max-width:85%}
  .msg-del{opacity:1}
}

/* ---------- Abertura (splash) ---------- */
#splash{position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:radial-gradient(120% 90% at 50% 0%,#17324a 0%,#0f2231 55%,#0a1823 100%);color:#fff;transition:opacity .55s ease,visibility .55s}
#splash.out{opacity:0;visibility:hidden}
.sp-in{display:flex;flex-direction:column;align-items:center;gap:6px}
.sp-plumb{width:60px;height:130px;overflow:visible}
.sp-line{stroke:#e0a63a;stroke-width:2;stroke-linecap:round;stroke-dasharray:72;stroke-dashoffset:72;animation:spLine .6s cubic-bezier(.4,0,.2,1) .1s forwards}
.sp-bob{fill:#e0a63a;transform-origin:30px 0;opacity:0;animation:spDrop .55s cubic-bezier(.3,1.4,.5,1) .55s forwards,spSwing 1.6s ease-in-out 1.1s 1 forwards}
.sp-word{font:800 34px/1 var(--f-display);letter-spacing:-.02em;opacity:0;transform:translateY(10px);animation:spUp .5s ease .85s forwards}
.sp-sub{font-size:13px;color:#9fb3c5;opacity:0;transform:translateY(8px);animation:spUp .5s ease 1s forwards}
.sp-bar{width:140px;height:3px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:14px;opacity:0;animation:spFade .3s ease 1.05s forwards}
.sp-bar i{display:block;height:100%;width:40%;background:#e0a63a;border-radius:3px;animation:spBar 1s ease-in-out 1.05s infinite}
@keyframes spLine{to{stroke-dashoffset:0}}
@keyframes spDrop{from{opacity:0;transform:translateY(-40px)}to{opacity:1;transform:none}}
@keyframes spSwing{0%{transform:rotate(0)}25%{transform:rotate(5deg)}55%{transform:rotate(-3deg)}80%{transform:rotate(1.5deg)}100%{transform:rotate(0)}}
@keyframes spUp{to{opacity:1;transform:none}}
@keyframes spFade{to{opacity:1}}
@keyframes spBar{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}

/* ---------- Tela de login ---------- */
.auth{min-height:100vh;min-height:100dvh;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);background:var(--bg);position:relative;overflow:hidden}
.auth-brand{position:relative;overflow:hidden;background:radial-gradient(110% 80% at 0% 0%,#1b3a55 0%,#0f2231 55%,#0a1823 100%);color:#c9d6e2;padding:48px 56px;display:flex;flex-direction:column;gap:28px}
.auth-brand .brand.lg b{font-size:24px;color:#fff}
.auth-brand .brand small{color:#8fa6ba}
.auth-brand h1{color:#fff;font-size:clamp(28px,3.1vw,42px);font-weight:800;line-height:1.1;max-width:15ch;letter-spacing:-.025em}
.auth-brand h1 em{font-style:normal;color:#e0a63a}
.auth-brand .props b{color:#fff}
.auth-brand .props .ic{color:#e0a63a}
.auth-foot{margin-top:auto;font-size:12px;color:#7f95a8}
.auth-deco{position:absolute;inset:0;pointer-events:none}
.auth-deco .orb{position:absolute;border-radius:50%;filter:blur(60px);opacity:.35}
.auth-deco .o1{width:420px;height:420px;background:#1f6f9c;right:-140px;top:-120px;animation:orb 14s ease-in-out infinite alternate}
.auth-deco .o2{width:300px;height:300px;background:#e0a63a;left:-120px;bottom:-140px;opacity:.18;animation:orb 18s ease-in-out infinite alternate-reverse}
.auth-deco .fio{position:absolute;right:72px;top:0;width:1px;height:62%;background:linear-gradient(#e0a63a,transparent);opacity:.6;transform-origin:top;animation:fio 1.1s cubic-bezier(.4,0,.2,1) .2s both}
.auth-deco .fio::after{content:"";position:absolute;left:-7px;bottom:-14px;width:15px;height:20px;background:#e0a63a;clip-path:polygon(50% 0,100% 40%,50% 100%,0 40%);animation:swing 4s ease-in-out 1.3s infinite;transform-origin:50% -300px}
@keyframes orb{to{transform:translate(-40px,30px) scale(1.08)}}
@keyframes fio{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes swing{0%,100%{transform:rotate(0)}50%{transform:rotate(1.2deg)}}
.auth-panel{display:grid;place-items:center;padding:40px 24px;position:relative}
.auth-card{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:34px 32px;box-shadow:0 10px 40px rgba(15,30,44,.08)}
.auth-card h2{font-size:25px;letter-spacing:-.02em}
.auth-card .lede{color:var(--ink-2);margin:6px 0 22px}
.auth-logo{display:none;align-items:center;gap:10px;margin-bottom:22px}
.auth-logo .ic{width:30px;height:30px;color:var(--plumb)}
.auth-logo b{font:800 20px/1 var(--f-display)}
.auth-form{display:flex;flex-direction:column;gap:14px}
.in-ic{position:relative;display:block}
.in-ic>.ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--muted);pointer-events:none}
.in-ic input{width:100%;padding:11px 12px 11px 38px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface);font-size:15px}
.in-ic input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.in-ic .eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;padding:6px;border-radius:8px;cursor:pointer;color:var(--muted);display:grid}
.in-ic .eye:hover{color:var(--ink)}
.in-ic .eye .ic{width:18px;height:18px}
.in-ic.pass input{padding-right:42px}
.auth-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:13.5px}
.auth-row label{display:inline-flex;align-items:center;gap:7px;cursor:pointer;color:var(--ink-2)}
.auth-row input[type=checkbox]{width:16px;height:16px;margin:0}
.btn.lg{padding:12px 16px;font-size:15px;border-radius:10px;justify-content:center}
.auth-or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;margin:6px 0}
.auth-or::before,.auth-or::after{content:"";flex:1;height:1px;background:var(--line)}
.quick-btn{width:100%;justify-content:center;border-style:dashed}
.quick-tag{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;background:var(--warn-soft);color:var(--warn);padding:1px 7px;border-radius:999px}
.auth-msg{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:10px;font-size:13.5px}
.auth-msg.err{background:var(--crit-soft);color:var(--crit)}
.auth-msg.ok{background:var(--good-soft);color:var(--good)}
.auth-msg .ic{flex:none;margin-top:1px}
.auth-back{margin-top:14px;text-align:center}
.auth-help{margin-top:18px;text-align:center;font-size:12px;color:var(--muted)}
/* entrada em cascata */
.rise{opacity:0;transform:translateY(14px);animation:rise .6s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:calc(var(--d,0) * 90ms + 150ms)}
@keyframes rise{to{opacity:1;transform:none}}
.booting .rise,.booting .auth-deco *{animation-play-state:paused}
.auth.static .rise{animation:none;opacity:1;transform:none}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
/* app entra com um fade ao logar */
.app.enter{animation:appIn .45s ease both}
@keyframes appIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* acesso rápido */
.qa-roles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.qa-role{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;text-align:left;transition:border-color .15s,transform .15s}
.qa-role:hover{border-color:var(--accent);transform:translateY(-1px)}
.qa-role .ic{width:22px;height:22px;color:var(--accent)}
.qa-role b{font-size:14px}
.qa-role small{color:var(--muted);font-size:12px;line-height:1.35}
@media (max-width:1020px){
  .auth{grid-template-columns:minmax(0,1fr)}
  .auth-brand{display:none}
  .auth-panel{min-height:100vh;min-height:100dvh;padding:28px 16px;background:radial-gradient(120% 60% at 50% 0%,#17324a 0%,#0f2231 60%,#0a1823 100%)}
  .auth-logo{display:flex;color:var(--ink)}
}
@media (max-width:480px){
  .auth-card{padding:26px 20px;border-radius:16px}
  .qa-roles{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important}
  .rise,.sp-line,.sp-bob,.sp-word,.sp-sub,.sp-bar,.auth-deco *,.app.enter{animation:none!important;opacity:1!important;transform:none!important;stroke-dashoffset:0!important}
}
</style>
